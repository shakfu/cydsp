[project]
name = "cydsp"
version = "0.1.3"
description = "High-performance Python DSP toolkit built on C++ libraries via nanobind"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["nanodsp==0.1.3"]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" },
    { name = "cydsp contributors" }
]
keywords = ["audio", "dsp", "signal-processing", "filters", "fft", "synthesis", "effects"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
